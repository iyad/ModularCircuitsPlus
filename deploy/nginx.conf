# /etc/nginx/sites-available/modularcircuits
# After enabling, run `sudo certbot --nginx -d bitsandgates.com -d www.bitsandgates.com` to add HTTPS
# (Auth0 requires HTTPS outside localhost). certbot edits this file in place to add the 443 listeners.

# www → apex, so there is a single origin to register in Auth0.
server {
    listen 80;
    server_name www.bitsandgates.com;
    return 301 $scheme://bitsandgates.com$request_uri;
}

server {
    listen 80;
    server_name bitsandgates.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
